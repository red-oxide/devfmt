name: Check pinned inputs

# Inputs pinned to a release tag (import-tree, nixfmt-rs) are never moved by
# the daily lockfile update. This opens an issue, or updates the open one,
# when any of them has a newer release.

on:
  schedule:
    # Mondays at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-inputs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find inputs with newer releases
        id: outdated
        run: |
          report=$(bash scripts/pinned-inputs.sh)
          echo "$report"
          {
            echo "report<<EOF"
            echo "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the tracking issue
        if: steps.outdated.outputs.report != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.outdated.outputs.report }}
        run: |
          title="Pinned flake inputs have new releases"
          {
            echo "These inputs are pinned to a release tag in \`flake.nix\` and have a newer release:"
            echo
            echo "| Input | Repository | Pinned | Latest |"
            echo "| --- | --- | --- | --- |"
            while read -r input repo current latest; do
              echo "| \`$input\` | [$repo](https://github.com/$repo/releases) | \`$current\` | \`$latest\` |"
            done <<< "$REPORT"
            echo
            echo "Bump the tag in \`flake.nix\`, run \`nix flake update <input>\`, and check the release notes for changes downstream flakes would notice."
          } > body.md

          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
