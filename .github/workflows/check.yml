name: Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # The Update pins workflow pushes with GITHUB_TOKEN, which doesn't trigger
  # `push`, so check its lock updates when it finishes.
  workflow_run:
    workflows: [Update pins]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    uses: red-oxide/github-workflows/.github/workflows/check.yml@master
